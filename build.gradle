buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupAndSubgroups 'software.bernie.geckolib' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://cursemaven.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf('curse.maven:icys-better-horses-1527172:9000569')
    compileOnly fg.deobf('curse.maven:horse-combat-controls-476789:6788953')
    compileOnly fg.deobf('maven.modrinth:supplementaries:1.20-3.1.44-forge')
    compileOnly fg.deobf('maven.modrinth:moonlight:1.20-2.16.38B-forge')

    runtimeOnly fg.deobf('curse.maven:icys-better-horses-1527172:9000569')
    runtimeOnly fg.deobf('curse.maven:horse-combat-controls-476789:6788953')
    runtimeOnly fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.7.2')
    runtimeOnly fg.deobf('maven.modrinth:patchouli:1.20.1-85-forge')

    if (!project.hasProperty('withoutSupplementaries')) {
        runtimeOnly fg.deobf('maven.modrinth:supplementaries:1.20-3.1.44-forge')
        runtimeOnly fg.deobf('maven.modrinth:moonlight:1.20-2.16.38B-forge')
    }

    if (!project.hasProperty('withoutEpicKnights')) {
        runtimeOnly fg.deobf('maven.modrinth:L6jvzao4:gJ59URg4')
        runtimeOnly fg.deobf('maven.modrinth:architectury-api:9.2.14+forge')
        runtimeOnly fg.deobf('maven.modrinth:cloth-config:11.1.136+forge')
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def replacements = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replacements
    filesMatching(['META-INF/mods.toml']) {
        expand replacements
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
